<style>
  /* ============================================================
     REVLAR — single-file marketing site
     Palette: deep navy world, single electric-cyan accent.
     ============================================================ */

  :root {
    --navy-950: #060E1C;
    --navy-900: #FFFFFF;   /* base background */
    --navy-850: #EAF1F8;
    --navy-800: #F6F9FC;   /* cards / panels */
    --navy-750: #13243F;
    --navy-700: #18304F;

    --cyan:        #0EA5E9;
    --cyan-bright: #0284C7;
    --cyan-dim:    #0369A1;
    --cyan-glow:   rgba(14, 165, 233, 0.16);

    --text:    #0B1526;
    --muted:   #4C5C77;
    --muted-2: #7C8AA3;

    --line:        rgba(15, 32, 56, 0.10);
    --line-strong: rgba(15, 32, 56, 0.18);

    --good: #16A34A;
    --warn: #B45309;
    --flag: #E11D48;

    --radius: 14px;
    --radius-sm: 10px;
    --maxw: 1140px;

    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;

    --shadow: 0 24px 60px -28px rgba(15, 23, 42, 0.18);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--navy-900);
    color: var(--text);
    line-height: 1.6;
    font-size: 17px;
    letter-spacing: 0.01em;
    overflow-x: hidden;
    /* subtle depth without a literal grid/waveform */
    background-image:
      radial-gradient(900px 520px at 78% -8%, rgba(14,165,233,0.10), transparent 60%),
      radial-gradient(800px 600px at -10% 12%, rgba(14,165,233,0.05), transparent 55%);
    background-attachment: fixed;
  }

  h1, h2, h3, h4 { line-height: 1.12; letter-spacing: -0.02em; font-weight: 650; margin: 0; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--cyan); color: var(--navy-950); }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }

  /* ---------- shared bits ---------- */
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cyan);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 22px; height: 1px;
    background: var(--cyan);
    display: inline-block;
    opacity: 0.7;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 13px 22px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--cyan);
    color: var(--navy-950);
    box-shadow: 0 10px 30px -10px var(--cyan-glow), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .btn-primary:hover { background: var(--cyan-bright); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--line-strong);
  }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan-bright); }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255,0.72);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease, background .3s ease;
  }
  header.scrolled { border-bottom-color: var(--line); background: rgba(255, 255, 255,0.9); }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
    gap: 20px;
  }
  .brand { display: inline-flex; align-items: center; gap: 11px; }
  .brand .mark { width: 30px; height: 37px; flex: none; }
  .brand .name {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.04em;
  }
  .brand .name b { color: var(--cyan); font-weight: 700; }

  .nav-links { display: flex; align-items: center; gap: 30px; }
  .nav-links a {
    font-size: 14.5px;
    color: var(--muted);
    font-weight: 500;
    transition: color .18s ease;
    position: relative;
  }
  .nav-links a:hover { color: var(--text); }

  .nav-right { display: flex; align-items: center; gap: 16px; }

  .vet-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(15,23,42,0.035);
  }
  .vet-badge svg { width: 13px; height: 13px; color: var(--cyan); }

  .menu-btn {
    display: none;
    background: none; border: 1px solid var(--line-strong);
    color: var(--text);
    border-radius: 9px;
    width: 42px; height: 42px;
    cursor: pointer;
    align-items: center; justify-content: center;
  }
  .menu-btn svg { width: 20px; height: 20px; }

  /* ---------- hero ---------- */
  .hero { padding: 84px 0 70px; position: relative; }
  .hero-grid {
    display: grid;
